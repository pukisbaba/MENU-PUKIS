<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Kue Pukis Baba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cappuccino: {
              50: "#FDFBF7", 100: "#F7F1E5", 200: "#EADBC8", 300: "#DAC0A3",
              400: "#C6A982", 500: "#B08968", 600: "#9C6644", 700: "#7F4F24",
              800: "#582F0E", 900: "#3A1E08",
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f7f1e5
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #b08968;
      border-radius: 4px
    }

    /* Toggle switch */
    .toggle-wrap {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 28px
    }

    .toggle-wrap input {
      display: none
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #fca5a5;
      border-radius: 999px;
      transition: background .3s
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform .3s;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25)
    }

    .toggle-wrap input:checked+.toggle-slider {
      background: #6ee7b7
    }

    .toggle-wrap input:checked+.toggle-slider::before {
      transform: translateX(26px)
    }

    /* Status badges */
    .badge-ok {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7
    }

    .badge-out {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5
    }

    /* Toast */
    #adminToast {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 9999
    }

    #adminToast.hidden {
      display: none
    }
  </style>
</head>

<body class="bg-cappuccino-50 text-cappuccino-900 font-sans min-h-screen flex flex-col">

  <!-- Toast -->
  <div id="adminToast"
    class="hidden flex items-center gap-2 bg-cappuccino-900 text-white px-4 py-3 rounded-xl shadow-2xl text-sm border border-cappuccino-700">
    <i class="fas fa-check-circle text-green-400"></i>
    <span id="adminToastMsg">Tersimpan!</span>
  </div>

  <!-- Header -->
  <header class="bg-cappuccino-900 text-white p-4 shadow-md flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-cappuccino-700 rounded-xl flex items-center justify-center">
        <i class="fas fa-user-shield text-cappuccino-200"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold leading-tight">Admin Dashboard</h1>
        <p class="text-xs text-cappuccino-400">Kue Pukis Baba</p>
      </div>
    </div>
    <button onclick="sessionStorage.setItem('adminMode','1'); window.location.href='index.html';"
      class="bg-cappuccino-700 hover:bg-cappuccino-600 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition">
      <i class="fas fa-arrow-left text-xs"></i> Kembali ke Menu
    </button>
  </header>

  <main class="flex-1 p-5 custom-scrollbar max-w-3xl mx-auto w-full space-y-10">

    <!-- ===== STOCK MANAGEMENT ===== -->
    <section>
      <div class="flex items-center gap-2 mb-1">
        <i class="fas fa-boxes text-cappuccino-600 text-lg"></i>
        <h2 class="text-xl font-bold text-cappuccino-800">Manajemen Stok</h2>
      </div>
      <p class="text-xs text-cappuccino-500 mb-4">
        Klik toggle untuk mengubah status stok. Perubahan disimpan otomatis dan langsung tampil di halaman menu
        pelanggan.
      </p>
      <div class="bg-white rounded-2xl shadow-sm border border-cappuccino-200 overflow-hidden">
        <!-- Card header -->
        <div class="flex items-center justify-between bg-cappuccino-100 border-b border-cappuccino-200 px-4 py-3">
          <span class="text-xs font-bold text-cappuccino-700 uppercase tracking-wide">Menu</span>
          <span class="text-xs font-bold text-cappuccino-700 uppercase tracking-wide">Status &amp; Ubah</span>
        </div>
        <div id="stockTableBody"></div>
      </div>
    </section>

    <!-- ===== CUSTOMER REVIEWS ===== -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <i class="fas fa-star text-amber-500 text-lg"></i>
          <h2 class="text-xl font-bold text-cappuccino-800">Customer Reviews</h2>
        </div>
        <div id="reviewCountBadge"
          class="bg-cappuccino-100 text-cappuccino-700 text-xs font-bold px-3 py-1 rounded-full border border-cappuccino-200">
          0 Ulasan
        </div>
      </div>

      <!-- Rating Summary (Google-style) -->
      <div id="ratingSummaryBox" class="bg-white rounded-2xl border border-cappuccino-200 shadow-sm p-5 mb-5 hidden">
        <div class="flex items-center gap-6">
          <div class="text-center min-w-[80px]">
            <p id="avgRatingDisplay" class="text-5xl font-black text-cappuccino-900">0.0</p>
            <div id="avgStarDisplay" class="flex justify-center gap-0.5 my-1 text-amber-400 text-base"></div>
            <p id="totalReviewDisplay" class="text-xs text-cappuccino-500">dari 0 ulasan</p>
          </div>
          <div class="flex-grow space-y-1.5" id="ratingBarsContainer"></div>
        </div>
      </div>

      <!-- Review Cards -->
      <div id="adminReviewsContainer" class="space-y-3"></div>
    </section>

  </main>

  <script>
    // Menu items (same IDs as menu.html)
    const MENU_ITEMS = [
      { id: 1, name: "PUKIS ORIGINAL" }, { id: 2, name: "PUKIS MESES" },
      { id: 3, name: "PUKIS MOCCA" }, { id: 4, name: "PUKIS REDVELVET" },
      { id: 5, name: "PUKIS PANDAN" }, { id: 6, name: "PUKIS KEJU" },
      { id: 7, name: "PUKIS OREO" },
    ];

    // ---- Stock helpers ----
    function getStock() {
      try { return JSON.parse(localStorage.getItem("pukisStockStatus") || "{}"); }
      catch (e) { return {}; }
    }
    function setStock(s) { localStorage.setItem("pukisStockStatus", JSON.stringify(s)); }

    function isAvailable(itemId) {
      const s = getStock();
      return s[itemId] !== "out";
    }

    function toggleStock(itemId) {
      const s = getStock();
      s[itemId] = isAvailable(itemId) ? "out" : "available";
      setStock(s);
      renderStockTable();
      showToast(s[itemId] === "available" ? "✅ Status: Tersedia" : "❌ Status: Sudah Habis");
    }

    function renderStockTable() {
      const container = document.getElementById("stockTableBody");
      container.innerHTML = "";
      MENU_ITEMS.forEach(item => {
        const avail = isAvailable(item.id);
        const row = document.createElement("div");
        row.className = "flex items-center justify-between px-4 py-3 border-b border-cappuccino-100 last:border-b-0 hover:bg-cappuccino-50 transition-colors";
        row.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <div class="w-8 h-8 rounded-xl bg-cappuccino-100 flex items-center justify-center flex-shrink-0">
              <i class="fas fa-cookie-bite text-cappuccino-500 text-sm"></i>
            </div>
            <span class="font-semibold text-cappuccino-900 text-sm leading-tight">${item.name}</span>
          </div>
          <div class="flex items-center gap-3 flex-shrink-0 ml-3">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold whitespace-nowrap ${avail ? "badge-ok" : "badge-out"}">
              <i class="fas ${avail ? "fa-check-circle" : "fa-times-circle"} text-xs"></i>
              ${avail ? "Tersedia" : "Habis"}
            </span>
            <label class="toggle-wrap flex-shrink-0" title="Klik untuk ubah status">
              <input type="checkbox" ${avail ? "checked" : ""} onchange="toggleStock(${item.id})" />
              <span class="toggle-slider"></span>
            </label>
          </div>`;
        container.appendChild(row);
      });
    }

    // ---- Review helpers ----
    function renderReviews() {
      const container = document.getElementById("adminReviewsContainer");
      const countBadge = document.getElementById("reviewCountBadge");
      const summaryBox = document.getElementById("ratingSummaryBox");
      const reviews = JSON.parse(localStorage.getItem("reviews") || "[]");

      countBadge.textContent = reviews.length + " Ulasan";

      if (reviews.length === 0) {
        summaryBox.classList.add("hidden");
        container.innerHTML = `
          <div class="text-center py-10 bg-white rounded-2xl border border-cappuccino-200">
            <i class="fas fa-comment-slash text-4xl text-cappuccino-300 mb-3"></i>
            <p class="text-cappuccino-500 text-sm font-medium">Belum ada review dari pelanggan.</p>
          </div>`;
        return;
      }

      summaryBox.classList.remove("hidden");

      // Average rating
      const avg = reviews.reduce((s, r) => s + (r.rating || 0), 0) / reviews.length;
      document.getElementById("avgRatingDisplay").textContent = avg.toFixed(1);
      document.getElementById("totalReviewDisplay").textContent = "dari " + reviews.length + " ulasan";

      const avgStarDiv = document.getElementById("avgStarDisplay");
      avgStarDiv.innerHTML = "";
      for (let i = 1; i <= 5; i++) {
        const s = document.createElement("i");
        s.className = "fas fa-star " + (i <= Math.round(avg) ? "text-amber-400" : "text-cappuccino-200");
        avgStarDiv.appendChild(s);
      }

      // Rating bars
      const barsEl = document.getElementById("ratingBarsContainer");
      barsEl.innerHTML = "";
      for (let star = 5; star >= 1; star--) {
        const cnt = reviews.filter(r => (r.rating || 0) === star).length;
        const pct = Math.round((cnt / reviews.length) * 100);
        barsEl.innerHTML += `
          <div class="flex items-center gap-2 text-xs">
            <span class="text-cappuccino-700 font-bold w-3 text-right">${star}</span>
            <i class="fas fa-star text-amber-400" style="font-size:10px"></i>
            <div class="flex-grow bg-cappuccino-100 rounded-full h-2.5 overflow-hidden">
              <div class="bg-amber-400 h-2.5 rounded-full transition-all duration-500" style="width:${pct}%"></div>
            </div>
            <span class="text-cappuccino-500 w-5 text-right">${cnt}</span>
          </div>`;
      }

      // Review cards
      container.innerHTML = "";
      reviews.slice().reverse().forEach((r, idx) => {
        const filled = "★".repeat(r.rating || 0);
        const empty = "☆".repeat(5 - (r.rating || 0));
        const d = new Date(r.id);
        const dateStr = d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
        const timeStr = d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
        const displayName = r.name ? r.name : ("Pelanggan #" + (reviews.length - idx));
        const initials = r.name ? r.name.charAt(0).toUpperCase() : "?";
        const div = document.createElement("div");
        div.className = "bg-white rounded-2xl p-4 border border-cappuccino-200 shadow-sm";
        div.innerHTML = `
          <div class="flex items-start gap-3 mb-3">
            <div class="w-10 h-10 rounded-full bg-cappuccino-100 flex items-center justify-center flex-shrink-0 font-bold text-cappuccino-600">
              ${r.name ? initials : '<i class="fas fa-user text-cappuccino-400 text-sm"></i>'}
            </div>
            <div class="flex-grow min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <p class="font-bold text-cappuccino-900 text-sm">${displayName}</p>
                  <div class="flex items-center gap-1 mt-0.5">
                    <span class="text-amber-400 text-sm">${filled}${empty}</span>
                    <span class="text-xs text-cappuccino-500 font-semibold">${r.rating || 0}/5</span>
                  </div>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                  <span class="text-xs text-cappuccino-400 text-right">${dateStr}<br/>${timeStr}</span>
                  <button onclick="deleteReviewAdmin(${r.id})"
                    class="w-8 h-8 bg-red-50 hover:bg-red-100 border border-red-200 text-red-500 rounded-xl flex items-center justify-center transition"
                    title="Hapus review ini">
                    <i class="fas fa-trash-alt text-xs"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <p class="text-sm text-cappuccino-800 leading-relaxed">${r.text}</p>
          ${r.photo ? `<img src="${r.photo}" class="mt-3 w-32 h-32 object-cover rounded-xl border border-cappuccino-200 shadow-sm"/>` : ""}`;
        container.appendChild(div);
      });
    }

    function deleteReviewAdmin(reviewId) {
      if (!confirm("Hapus review ini? Tindakan tidak bisa dibatalkan.")) return;
      const reviews = JSON.parse(localStorage.getItem("reviews") || "[]");
      const updated = reviews.filter(r => r.id !== reviewId);
      localStorage.setItem("reviews", JSON.stringify(updated));
      renderReviews();
      showToast("🗑 Review berhasil dihapus.");
    }

    function showToast(msg) {
      const t = document.getElementById("adminToast");
      document.getElementById("adminToastMsg").textContent = msg;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 3000);
    }

    renderStockTable();
    renderReviews();
  </script>
</body>

</html>
